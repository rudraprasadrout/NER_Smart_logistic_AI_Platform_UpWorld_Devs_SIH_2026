<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 48" fill="none">
  <defs>
    <!-- Cultural Color Gradients: Indian Saffron, Brahmaputra Teal & Northeast Emerald -->
    <linearGradient id="saffronGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="nerRiver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="gamusaRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>

  <!-- Left Cultural Emblem: Traditional Jaapi Peak + Northeast Handloom Geometry + Brahmaputra Curve -->
  <g transform="translate(4, 2)">
    <!-- Outer Sacred Mountain / Jaapi Conical Peak -->
    <polygon points="22,2 4,38 40,38" fill="none" stroke="url(#saffronGold)" stroke-width="2.2" stroke-linejoin="round" />

    <!-- Inner Cultural Sun / Chakra Arch -->
    <path d="M 14 20 A 8 8 0 0 1 30 20" fill="none" stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="2 2" opacity="0.9" />
    <circle cx="22" cy="20" r="2.5" fill="#f59e0b" />

    <!-- Traditional Diamond Weave Motif (Assam Gamusa & Naga Handloom Geometry) -->
    <polygon points="22,12 16,22 22,32 28,22" fill="none" stroke="#ef4444" stroke-width="1.4" stroke-linejoin="round" />
    <polygon points="22,17 19,22 22,27 25,22" fill="#ef4444" opacity="0.8" />

    <!-- Flanking Hills -->
    <polygon points="12,24 4,38 20,38" fill="none" stroke="#059669" stroke-width="1.5" stroke-linejoin="round" opacity="0.8" />
    <polygon points="32,24 24,38 40,38" fill="none" stroke="#059669" stroke-width="1.5" stroke-linejoin="round" opacity="0.8" />

    <!-- Winding Brahmaputra Lifeline Corridor (Fluid S-Curve) -->
    <path d="M 4 40 C 16 40 14 34 22 34 C 30 34 30 42 40 42" fill="none" stroke="url(#nerRiver)" stroke-width="2.8" stroke-linecap="round" />
    <path d="M 6 42 C 16 42 16 36 22 36 C 28 36 28 44 38 44" fill="none" stroke="#06b6d4" stroke-width="1.2" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Typography: Indie Brand Wordmark -->
  <g transform="translate(54, 11)">
    <!-- Wordmark -->
    <text x="0" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif" font-size="21" font-weight="900" letter-spacing="-0.6" fill="currentColor">
      Path<tspan fill="url(#saffronGold)">NER</tspan>
    </text>

    <!-- Subtitle: Culture & Mission -->
    <text x="1" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="7.5" font-weight="800" letter-spacing="1.4" fill="#059669" text-transform="uppercase">
      Northeast India · Smart Logistics
    </text>
  </g>

  <!-- Cultural Heritage / Version Pill Badge -->
  <g transform="translate(225, 14)">
    <rect x="0" y="0" width="46" height="19" rx="5" fill="rgba(245, 158, 11, 0.1)" stroke="url(#saffronGold)" stroke-width="1" />
    <text x="23" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="9" font-weight="800" fill="#f59e0b" text-anchor="middle" letter-spacing="0.4">
      NER AI
    </text>
  </g>
</svg>
