<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="favSaffron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="favRiver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="48" height="48" rx="12" fill="#0f172a" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.5" />

  <g transform="translate(4, 2)">
    <!-- Jaapi Peak -->
    <polygon points="20,4 4,36 36,36" fill="none" stroke="url(#favSaffron)" stroke-width="2.4" stroke-linejoin="round" />

    <!-- Gamusa Diamond Weave -->
    <polygon points="20,13 14,22 20,31 26,22" fill="none" stroke="#ef4444" stroke-width="1.8" stroke-linejoin="round" />
    <circle cx="20" cy="22" r="2.5" fill="#f59e0b" />

    <!-- Brahmaputra River Curve -->
    <path d="M 4 38 C 14 38 12 33 20 33 C 28 33 28 41 36 41" fill="none" stroke="url(#favRiver)" stroke-width="2.6" stroke-linecap="round" />
  </g>
</svg>
