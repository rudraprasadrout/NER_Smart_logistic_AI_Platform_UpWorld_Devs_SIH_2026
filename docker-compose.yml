version: '3.8'

services:
  pathner-app:
    build: .
    container_name: pathner_logistics_ai
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_DEBUG=False
      - PORT=5000
      - SECRET_KEY=pathner_prod_secret_key_change_in_production
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - MISTRAL_MODEL=mistral-small-latest
    volumes:
      - ./data:/app/data
